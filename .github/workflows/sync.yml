name: Sync GitHub forks to GitLab

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: fork-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build fork inventory from GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          python3 build_inventory.py > inventory.json
          echo "eligible=$(python3 -c 'import json;print(len(json.load(open("inventory.json"))))')" >> "$GITHUB_OUTPUT"

      - name: Sync forks
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          python3 sync_all.py inventory.json
